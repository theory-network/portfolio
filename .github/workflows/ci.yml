name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so `nx affected` can diff against the base commit
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Local Nx cache, restored from the latest run on the same branch or main
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      # Formatting (Prettier, via Nx)
      - run: npx nx format:check --all

      # PRs compare against the base branch; pushes to main against the previous commit
      - run: >-
          npx nx affected -t lint test build
          --base=${{ github.event.pull_request.base.sha || github.event.before }}
          --head=${{ github.sha }}

      # Prerender every route with a headless browser and check the saved HTML
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx nx affected -t prerender
          --base=${{ github.event.pull_request.base.sha || github.event.before }}
          --head=${{ github.sha }}
